<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket League Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            display: block;
        }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 100;
        }
        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 40px;
        }
        .team-score {
            text-align: center;
            color: white;
        }
        .team-score h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.8;
        }
        .team-score .score {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
        }
        .team-blue .score { color: #00aaff; text-shadow: 0 0 20px #00aaff; }
        .team-orange .score { color: #ff8800; text-shadow: 0 0 20px #ff8800; }
        .timer {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .boost-meter {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 300px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        .boost-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #ff4400, #ffaa00);
            transition: height 0.1s;
            border-radius: 0 0 8px 8px;
        }
        .boost-label {
            position: fixed;
            bottom: 350px;
            right: 40px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            width: 60px;
        }
        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            line-height: 1.6;
        }
        .goal-announcement {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 40px rgba(255,255,255,0.5);
            opacity: 0;
            transition: opacity 0.3s, transform 0.5s;
            pointer-events: none;
        }
        .goal-announcement.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }
        .countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 40px rgba(255,255,255,0.5);
            pointer-events: none;
        }
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: all;
        }
        #startScreen h1 {
            font-size: 4rem;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0,170,255,0.5);
        }
        #startScreen p {
            color: rgba(255,255,255,0.6);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        .start-btn {
            padding: 18px 60px;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            background: #00aaff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 30px rgba(0,170,255,0.3);
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0,170,255,0.5);
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>ROCKET SOCCER</h1>
        <p>Vehicular soccer with rocket boosts!</p>
        <button class="start-btn" onclick="startGame()">PLAY</button>
    </div>

    <div id="ui" style="display:none;">
        <div class="scoreboard">
            <div class="team-score team-blue">
                <h2>Blue Team</h2>
                <div class="score" id="blueScore">0</div>
            </div>
            <div class="timer" id="timer">5:00</div>
            <div class="team-score team-orange">
                <h2>Orange Team</h2>
                <div class="score" id="orangeScore">0</div>
            </div>
        </div>
        <div class="boost-label">Boost</div>
        <div class="boost-meter">
            <div class="boost-fill" id="boostFill" style="height: 100%;"></div>
        </div>
        <div class="controls-hint">
            W/A/S/D - Drive & Steer | Space - Jump | Shift - Boost<br>
            Goal: Hit the ball into the opponent's goal!
        </div>
        <div class="goal-announcement" id="goalText"></div>
        <div class="countdown" id="countdown"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // ============ GLOBALS ============
        let scene, camera, renderer, world;
        let clock, deltaTime;
        let gameRunning = false;
        let gameTime = 300; // 5 minutes
        let blueScore = 0, orangeScore = 0;
        
        // Physics bodies
        let carBody, ballBody;
        let carMesh, ballMesh;
        let aiCarBody, aiCarMesh;
        
        // Materials
        let groundMaterial, wallMaterial, carMaterial, ballMaterial;
        
        // Controls
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        
        // Car state
        let boostAmount = 100;
        const MAX_BOOST = 100;
        const BOOST_DRAIN = 40;
        const BOOST_RECHARGE = 15;
        const CAR_SPEED = 35;
        const CAR_TURN_SPEED = 2.5;
        const JUMP_FORCE = 12;
        const BOOST_FORCE = 60;
        
        let canJump = true;
        let isJumping = false;
        
        // AI state
        let aiTarget = new THREE.Vector3();
        
        // Effects
        let boostParticles = [];
        
        // ============ INIT ============
        function init() {
            // Three.js scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 50, 200);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404080, 0.5);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 200;
            dirLight.shadow.camera.left = -60;
            dirLight.shadow.camera.right = 60;
            dirLight.shadow.camera.top = 60;
            dirLight.shadow.camera.bottom = -60;
            scene.add(dirLight);
            
            // Additional arena lights
            const pointLight1 = new THREE.PointLight(0x00aaff, 0.5, 100);
            pointLight1.position.set(-30, 20, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xff8800, 0.5, 100);
            pointLight2.position.set(30, 20, 0);
            scene.add(pointLight2);
            
            // Cannon.js world
            world = new CANNON.World();
            world.gravity.set(0, -20, 0);
            world.broadphase = new CANNON.SAPBroadphase(world);
            world.solver.iterations = 10;
            
            // Materials
            groundMaterial = new CANNON.Material('ground');
            wallMaterial = new CANNON.Material('wall');
            carMaterial = new CANNON.Material('car');
            ballMaterial = new CANNON.Material('ball');
            
            // Contact materials
            const groundCarContact = new CANNON.ContactMaterial(groundMaterial, carMaterial, {
                friction: 0.3,
                restitution: 0.1
            });
            world.addContactMaterial(groundCarContact);
            
            const wallCarContact = new CANNON.ContactMaterial(wallMaterial, carMaterial, {
                friction: 0.1,
                restitution: 0.3
            });
            world.addContactMaterial(wallCarContact);
            
            const carBallContact = new CANNON.ContactMaterial(carMaterial, ballMaterial, {
                friction: 0.2,
                restitution: 0.7
            });
            world.addContactMaterial(carBallContact);
            
            const groundBallContact = new CANNON.ContactMaterial(groundMaterial, ballMaterial, {
                friction: 0.4,
                restitution: 0.6
            });
            world.addContactMaterial(groundBallContact);
            
            const wallBallContact = new CANNON.ContactMaterial(wallMaterial, ballMaterial, {
                friction: 0.1,
                restitution: 0.5
            });
            world.addContactMaterial(wallBallContact);
            
            // Build arena
            buildArena();
            
            // Create cars
            createPlayerCar();
            createAICar();
            
            // Create ball
            createBall();
            
            // Input
            setupInputs();
            
            // Resize
            window.addEventListener('resize', onWindowResize);
            
            // Clock
            clock = new THREE.Clock();
        }
        
        // ============ ARENA ============
        function buildArena() {
            const arenaLength = 120;
            const arenaWidth = 80;
            const wallHeight = 15;
            const goalWidth = 20;
            const goalHeight = 10;
            const goalDepth = 10;
            
            // Floor
            const floorGeo = new THREE.PlaneGeometry(arenaLength, arenaWidth);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x1a1a2e,
                roughness: 0.8,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Floor grid pattern
            const gridHelper = new THREE.GridHelper(arenaLength, 24, 0x333366, 0x222244);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
            
            // Center line
            const centerLineGeo = new THREE.PlaneGeometry(0.5, arenaWidth);
            const centerLineMat = new THREE.MeshBasicMaterial({ color: 0x4444aa, transparent: true, opacity: 0.5 });
            const centerLine = new THREE.Mesh(centerLineGeo, centerLineMat);
            centerLine.rotation.x = -Math.PI / 2;
            centerLine.position.y = 0.02;
            scene.add(centerLine);
            
            // Center circle
            const circleGeo = new THREE.RingGeometry(8, 8.5, 32);
            const circleMat = new THREE.MeshBasicMaterial({ color: 0x4444aa, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
            const circle = new THREE.Mesh(circleGeo, circleMat);
            circle.rotation.x = -Math.PI / 2;
            circle.position.y = 0.02;
            scene.add(circle);
            
            // Floor physics
            const floorShape = new CANNON.Box(new CANNON.Vec3(arenaLength/2, 0.1, arenaWidth/2));
            const floorBody = new CANNON.Body({ mass: 0, material: groundMaterial });
            floorBody.addShape(floorShape);
            floorBody.position.set(0, -0.1, 0);
            world.addBody(floorBody);
            
            // Walls
            const wallThickness = 2;
            
            // Side walls
            const sideWallGeo = new THREE.BoxGeometry(arenaLength, wallHeight, wallThickness);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2a4a, roughness: 0.5 });
            
            const topWall = new THREE.Mesh(sideWallGeo, wallMat);
            topWall.position.set(0, wallHeight/2, -arenaWidth/2 - wallThickness/2);
            topWall.castShadow = true;
            topWall.receiveShadow = true;
            scene.add(topWall);
            
            const topWallBody = new CANNON.Body({ mass: 0, material: wallMaterial });
            topWallBody.addShape(new CANNON.Box(new CANNON.Vec3(arenaLength/2, wallHeight/2, wallThickness/2)));
            topWallBody.position.copy(topWall.position);
            world.addBody(topWallBody);
            
            const bottomWall = new THREE.Mesh(sideWallGeo, wallMat);
            bottomWall.position.set(0, wallHeight/2, arenaWidth/2 + wallThickness/2);
            bottomWall.castShadow = true;
            bottomWall.receiveShadow = true;
            scene.add(bottomWall);
            
            const bottomWallBody = new CANNON.Body({ mass: 0, material: wallMaterial });
            bottomWallBody.addShape(new CANNON.Box(new CANNON.Vec3(arenaLength/2, wallHeight/2, wallThickness/2)));
            bottomWallBody.position.copy(bottomWall.position);
            world.addBody(bottomWallBody);
            
            // End walls (with goals)
            const endWallWidth = (arenaWidth - goalWidth) / 2;
            const endWallGeo = new THREE.BoxGeometry(wallThickness, wallHeight, endWallWidth);
            
            // Left goal side walls
            const leftTopWall = new THREE.Mesh(endWallGeo, wallMat);
            leftTopWall.position.set(-arenaLength/2 - wallThickness/2, wallHeight/2, -arenaWidth/2 + endWallWidth/2);
            leftTopWall.castShadow = true;
            scene.add(leftTopWall);
            
            const leftTopWallBody = new CANNON.Body({ mass: 0, material: wallMaterial });
            leftTopWallBody.addShape(new CANNON.Box(new CANNON.Vec3(wallThickness/2, wallHeight/2, endWallWidth/2)));
            leftTopWallBody.position.copy(leftTopWall.position);
            world.addBody(leftTopWallBody);
            
            const leftBottomWall = new THREE.Mesh(endWallGeo, wallMat);
            leftBottomWall.position.set(-arenaLength/2 - wallThickness/2, wallHeight/2, arenaWidth/2 - endWallWidth/2);
            leftBottomWall.castShadow = true;
            scene.add(leftBottomWall);
            
            const leftBottomWallBody = new CANNON.Body({ mass: 0, material: wallMaterial });
            leftBottomWallBody.addShape(new CANNON.Box(new CANNON.Vec3(wallThickness/2, wallHeight/2, endWallWidth/2)));
            leftBottomWallBody.position.copy(leftBottomWall.position);
            world.addBody(leftBottomWallBody);
            
            // Right goal side walls
            const rightTopWall = new THREE.Mesh(endWallGeo, wallMat);
            rightTopWall.position.set(arenaLength/2 + wallThickness/2, wallHeight/2, -arenaWidth/2 + endWallWidth/2);
            rightTopWall.castShadow = true;
            scene.add(rightTopWall);
            
            const rightTopWallBody = new CANNON.Body({ mass: 0, material: wallMaterial });
            rightTopWallBody.addShape(new CANNON.Box(new CANNON.Vec3(wallThickness/2, wallHeight/2, endWallWidth/2)));
            rightTopWallBody.position.copy(rightTopWall.position);
            world.addBody(rightTopWallBody);
            
            const rightBottomWall = new THREE.Mesh(endWallGeo, wallMat);
            rightBottomWall.position.set(arenaLength/2 + wallThickness/2, wallHeight/2, arenaWidth/2 - endWallWidth/2);
            rightBottomWall.castShadow = true;
            scene.add(rightBottomWall);
            
            const rightBottomWallBody = new CANNON.Body({ mass: 0, material: wallMaterial });
            rightBottomWallBody.addShape(new CANNON.Box(new CANNON.Vec3(wallThickness/2, wallHeight/2, endWallWidth/2)));
            rightBottomWallBody.position.copy(rightBottomWall.position);
            world.addBody(rightBottomWallBody);
            
            // Goal tops
            const goalTopGeo = new THREE.BoxGeometry(wallThickness, wallHeight - goalHeight, goalWidth);
            const leftGoalTop = new THREE.Mesh(goalTopGeo, wallMat);
            leftGoalTop.position.set(-arenaLength/2 - wallThickness/2, wallHeight/2 + goalHeight/2, 0);
            leftGoalTop.castShadow = true;
            scene.add(leftGoalTop);
            
            const leftGoalTopBody = new CANNON.Body({ mass: 0, material: wallMaterial });
            leftGoalTopBody.addShape(new CANNON.Box(new CANNON.Vec3(wallThickness/2, (wallHeight - goalHeight)/2, goalWidth/2)));
            leftGoalTopBody.position.copy(leftGoalTop.position);
            world.addBody(leftGoalTopBody);
            
            const rightGoalTop = new THREE.Mesh(goalTopGeo, wallMat);
            rightGoalTop.position.set(arenaLength/2 + wallThickness/2, wallHeight/2 + goalHeight/2, 0);
            rightGoalTop.castShadow = true;
            scene.add(rightGoalTop);
            
            const rightGoalTopBody = new CANNON.Body({ mass: 0, material: wallMaterial });
            rightGoalTopBody.addShape(new CANNON.Box(new CANNON.Vec3(wallThickness/2, (wallHeight - goalHeight)/2, goalWidth/2)));
            rightGoalTopBody.position.copy(rightGoalTop.position);
            world.addBody(rightGoalTopBody);
            
            // Goal posts
            const postGeo = new THREE.CylinderGeometry(0.3, 0.3, goalHeight, 8);
            const postMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, emissive: 0x222222 });
            
            // Left goal posts
            [-goalWidth/2, goalWidth/2].forEach(z => {
                const post = new THREE.Mesh(postGeo, postMat);
                post.position.set(-arenaLength/2, goalHeight/2, z);
                post.castShadow = true;
                scene.add(post);
                
                const postBody = new CANNON.Body({ mass: 0, material: wallMaterial });
                postBody.addShape(new CANNON.Cylinder(0.3, 0.3, goalHeight, 8));
                postBody.position.copy(post.position);
                world.addBody(postBody);
            });
            
            // Right goal posts
            [-goalWidth/2, goalWidth/2].forEach(z => {
                const post = new THREE.Mesh(postGeo, postMat);
                post.position.set(arenaLength/2, goalHeight/2, z);
                post.castShadow = true;
                scene.add(post);
                
                const postBody = new CANNON.Body({ mass: 0, material: wallMaterial });
                postBody.addShape(new CANNON.Cylinder(0.3, 0.3, goalHeight, 8));
                postBody.position.copy(post.position);
                world.addBody(postBody);
            });
            
            // Goal crossbars
            const crossbarGeo = new THREE.CylinderGeometry(0.3, 0.3, goalWidth, 8);
            const leftCrossbar = new THREE.Mesh(crossbarGeo, postMat);
            leftCrossbar.rotation.z = Math.PI / 2;
            leftCrossbar.position.set(-arenaLength/2, goalHeight, 0);
            scene.add(leftCrossbar);
            
            const rightCrossbar = new THREE.Mesh(crossbarGeo, postMat);
            rightCrossbar.rotation.z = Math.PI / 2;
            rightCrossbar.position.set(arenaLength/2, goalHeight, 0);
            scene.add(rightCrossbar);
            
            // Goal nets (visual only)
            const netGeo = new THREE.PlaneGeometry(goalWidth, goalHeight);
            const netMat = new THREE.MeshBasicMaterial({ 
                color: 0x888888, 
                transparent: true, 
                opacity: 0.3,
                side: THREE.DoubleSide,
                wireframe: true
            });
            
            const leftNet = new THREE.Mesh(netGeo, netMat);
            leftNet.position.set(-arenaLength/2 - goalDepth/2, goalHeight/2, 0);
            scene.add(leftNet);
            
            const rightNet = new THREE.Mesh(netGeo, netMat);
            rightNet.position.set(arenaLength/2 + goalDepth/2, goalHeight/2, 0);
            scene.add(rightNet);
            
            // Boost pads
            createBoostPads();
            
            // Corner ramps
            createCornerRamps(arenaLength, arenaWidth);
        }
        
        function createBoostPads() {
            const padPositions = [
                { x: 0, z: 0 },           // Center
                { x: -40, z: -30 },       // Left corner
                { x: -40, z: 30 },
                { x: 40, z: -30 },        // Right corner
                { x: 40, z: 30 },
                { x: -50, z: 0 },         // Mid left
                { x: 50, z: 0 },          // Mid right
            ];
            
            padPositions.forEach(pos => {
                const padGeo = new THREE.CylinderGeometry(2, 2, 0.1, 16);
                const padMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffaa00,
                    emissive: 0xff6600,
                    emissiveIntensity: 0.5
                });
                const pad = new THREE.Mesh(padGeo, padMat);
                pad.position.set(pos.x, 0.05, pos.z);
                scene.add(pad);
                
                // Glow ring
                const ringGeo = new THREE.RingGeometry(2.5, 3, 16);
                const ringMat = new THREE.MeshBasicMaterial({ 
                    color: 0xffaa00, 
                    transparent: true, 
                    opacity: 0.3,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = -Math.PI / 2;
                ring.position.set(pos.x, 0.02, pos.z);
                scene.add(ring);
            });
        }
        
        function createCornerRamps(arenaLength, arenaWidth) {
            // Simple corner indicators
            const cornerGeo = new THREE.ConeGeometry(3, 2, 4);
            const cornerMat = new THREE.MeshStandardMaterial({ color: 0x444466 });
            
            const corners = [
                { x: -arenaLength/2 + 5, z: -arenaWidth/2 + 5 },
                { x: -arenaLength/2 + 5, z: arenaWidth/2 - 5 },
                { x: arenaLength/2 - 5, z: -arenaWidth/2 + 5 },
                { x: arenaLength/2 - 5, z: arenaWidth/2 - 5 },
            ];
            
            corners.forEach(c => {
                const corner = new THREE.Mesh(cornerGeo, cornerMat);
                corner.position.set(c.x, 1, c.z);
                scene.add(corner);
            });
        }
        
        // ============ PLAYER CAR ============
        function createPlayerCar() {
            const carGroup = new THREE.Group();
            
            // Car body
            const bodyGeo = new THREE.BoxGeometry(2.5, 0.8, 4.5);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0x0088ff,
                roughness: 0.3,
                metalness: 0.7
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            carGroup.add(body);
            
            // Car top
            const topGeo = new THREE.BoxGeometry(1.8, 0.5, 2.5);
            const top = new THREE.Mesh(topGeo, bodyMat);
            top.position.y = 1.25;
            top.castShadow = true;
            carGroup.add(top);
            
            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            
            const wheelPositions = [
                { x: -1.3, z: -1.5 },
                { x: 1.3, z: -1.5 },
                { x: -1.3, z: 1.5 },
                { x: 1.3, z: 1.5 },
            ];
            
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos.x, 0.4, pos.z);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });
            
            // Boost exhaust
            const exhaustGeo = new THREE.ConeGeometry(0.15, 0.5, 8);
            const exhaustMat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
            
            [-0.5, 0.5].forEach(x => {
                const exhaust = new THREE.Mesh(exhaustGeo, exhaustMat);
                exhaust.rotation.x = -Math.PI / 2;
                exhaust.position.set(x, 0.5, -2.5);
                carGroup.add(exhaust);
            });
            
            scene.add(carGroup);
            carMesh = carGroup;
            
            // Physics body
            const shape = new CANNON.Box(new CANNON.Vec3(1.25, 0.5, 2.25));
            carBody = new CANNON.Body({ 
                mass: 15, 
                material: carMaterial,
                angularDamping: 0.8,
                linearDamping: 0.2
            });
            carBody.addShape(shape);
            carBody.position.set(0, 2, 25);
            world.addBody(carBody);
        }
        
        // ============ AI CAR ============
        function createAICar() {
            const carGroup = new THREE.Group();
            
            // Car body - orange
            const bodyGeo = new THREE.BoxGeometry(2.5, 0.8, 4.5);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0xff6600,
                roughness: 0.3,
                metalness: 0.7
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            carGroup.add(body);
            
            // Car top
            const topGeo = new THREE.BoxGeometry(1.8, 0.5, 2.5);
            const top = new THREE.Mesh(topGeo, bodyMat);
            top.position.y = 1.25;
            top.castShadow = true;
            carGroup.add(top);
            
            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            
            const wheelPositions = [
                { x: -1.3, z: -1.5 },
                { x: 1.3, z: -1.5 },
                { x: -1.3, z: 1.5 },
                { x: 1.3, z: 1.5 },
            ];
            
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos.x, 0.4, pos.z);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });
            
            scene.add(carGroup);
            aiCarMesh = carGroup;
            
            // Physics body
            const shape = new CANNON.Box(new CANNON.Vec3(1.25, 0.5, 2.25));
            aiCarBody = new CANNON.Body({ 
                mass: 15, 
                material: carMaterial,
                angularDamping: 0.8,
                linearDamping: 0.2
            });
            aiCarBody.addShape(shape);
            aiCarBody.position.set(0, 2, -25);
            world.addBody(aiCarBody);
        }
        
        // ============ BALL ============
        function createBall() {
            const ballGeo = new THREE.SphereGeometry(2, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ 
                color: 0xeeeeee,
                roughness: 0.4,
                metalness: 0.1,
                emissive: 0x222222
            });
            ballMesh = new THREE.Mesh(ballGeo, ballMat);
            ballMesh.castShadow = true;
            scene.add(ballMesh);
            
            // Ball patterns
            const patternGeo = new THREE.SphereGeometry(2.01, 16, 16);
            const patternMat = new THREE.MeshBasicMaterial({ 
                color: 0x333333,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            const pattern = new THREE.Mesh(patternGeo, patternMat);
            ballMesh.add(pattern);
            
            // Physics
            const shape = new CANNON.Sphere(2);
            ballBody = new CANNON.Body({ 
                mass: 1, 
                material: ballMaterial,
                linearDamping: 0.3,
                angularDamping: 0.3
            });
            ballBody.addShape(shape);
            ballBody.position.set(0, 5, 0);
            world.addBody(ballBody);
        }
        
        // ============ INPUTS ============
        function setupInputs() {
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (keys.hasOwnProperty(key)) keys[key] = true;
                if (key === ' ') keys.space = true;
                if (key === 'shift') keys.shift = true;
            });
            
            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (keys.hasOwnProperty(key)) keys[key] = false;
                if (key === ' ') keys.space = false;
                if (key === 'shift') keys.shift = false;
            });
        }
        
        // ============ GAME LOGIC ============
        function updatePlayerCar(dt) {
            if (!carBody) return;
            
            // Get car forward direction
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyQuaternion(new THREE.Quaternion(
                carBody.quaternion.x,
                carBody.quaternion.y,
                carBody.quaternion.z,
                carBody.quaternion.w
            ));
            
            const right = new THREE.Vector3(1, 0, 0);
            right.applyQuaternion(new THREE.Quaternion(
                carBody.quaternion.x,
                carBody.quaternion.y,
                carBody.quaternion.z,
                carBody.quaternion.w
            ));
            
            // Drive
            if (keys.w) {
                const speed = keys.shift && boostAmount > 0 ? BOOST_FORCE : CAR_SPEED;
                carBody.applyForce(
                    new CANNON.Vec3(forward.x * speed, 0, forward.z * speed),
                    carBody.position
                );
                
                // Boost drain
                if (keys.shift && boostAmount > 0) {
                    boostAmount -= BOOST_DRAIN * dt;
                    if (boostAmount < 0) boostAmount = 0;
                    createBoostEffect();
                }
            }
            
            if (keys.s) {
                carBody.applyForce(
                    new CANNON.Vec3(-forward.x * CAR_SPEED * 0.6, 0, -forward.z * CAR_SPEED * 0.6),
                    carBody.position
                );
            }
            
            // Steer
            if (keys.a) {
                carBody.angularVelocity.y += CAR_TURN_SPEED * dt;
            }
            if (keys.d) {
                carBody.angularVelocity.y -= CAR_TURN_SPEED * dt;
            }
            
            // Jump
            if (keys.space && canJump && !isJumping) {
                carBody.velocity.y = JUMP_FORCE;
                isJumping = true;
                canJump = false;
                
                setTimeout(() => {
                    isJumping = false;
                    canJump = true;
                }, 800);
            }
            
            // Recharge boost
            if (!keys.shift && boostAmount < MAX_BOOST) {
                boostAmount += BOOST_RECHARGE * dt;
                if (boostAmount > MAX_BOOST) boostAmount = MAX_BOOST;
            }
            
            // Update UI
            document.getElementById('boostFill').style.height = (boostAmount / MAX_BOOST * 100) + '%';
            
            // Update mesh
            carMesh.position.copy(carBody.position);
            carMesh.quaternion.copy(carBody.quaternion);
        }
        
        function updateAICar(dt) {
            if (!aiCarBody || !ballBody) return;
            
            // Simple AI: chase the ball
            const ballPos = new THREE.Vector3(ballBody.position.x, ballBody.position.y, ballBody.position.z);
            const aiPos = new THREE.Vector3(aiCarBody.position.x, aiCarBody.position.y, aiCarBody.position.z);
            
            const direction = new THREE.Vector3().subVectors(ballPos, aiPos).normalize();
            
            // AI forward direction
            const aiForward = new THREE.Vector3(0, 0, -1);
            aiForward.applyQuaternion(new THREE.Quaternion(
                aiCarBody.quaternion.x,
                aiCarBody.quaternion.y,
                aiCarBody.quaternion.z,
                aiCarBody.quaternion.w
            ));
            
            // Simple steering toward ball
            const cross = new THREE.Vector3().crossVectors(aiForward, direction);
            const dot = aiForward.dot(direction);
            
            if (dot > 0.3) {
                aiCarBody.applyForce(
                    new CANNON.Vec3(aiForward.x * CAR_SPEED * 0.7, 0, aiForward.z * CAR_SPEED * 0.7),
                    aiCarBody.position
                );
            }
            
            if (cross.y > 0.1) {
                aiCarBody.angularVelocity.y += CAR_TURN_SPEED * 0.5 * dt;
            } else if (cross.y < -0.1) {
                aiCarBody.angularVelocity.y -= CAR_TURN_SPEED * 0.5 * dt;
            }
            
            // AI jump if ball is high
            if (ballPos.y > 3 && Math.abs(aiPos.x - ballPos.x) < 5 && Math.abs(aiPos.z - ballPos.z) < 5) {
                if (aiCarBody.velocity.y < 0.1) {
                    aiCarBody.velocity.y = JUMP_FORCE * 0.8;
                }
            }
            
            // Update mesh
            aiCarMesh.position.copy(aiCarBody.position);
            aiCarMesh.quaternion.copy(aiCarBody.quaternion);
        }
        
        function createBoostEffect() {
            // Simple boost particles
            const particleGeo = new THREE.SphereGeometry(0.1, 4, 4);
            const particleMat = new THREE.MeshBasicMaterial({ 
                color: 0xff6600,
                transparent: true,
                opacity: 0.8
            });
            
            for (let i = 0; i < 2; i++) {
                const particle = new THREE.Mesh(particleGeo, particleMat.clone());
                const offset = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                );
                
                const carForward = new THREE.Vector3(0, 0, -1);
                carForward.applyQuaternion(carMesh.quaternion);
                
                particle.position.copy(carMesh.position);
                particle.position.add(new THREE.Vector3((i === 0 ? -0.5 : 0.5), 0.5, 0));
                particle.position.sub(carForward.clone().multiplyScalar(2));
                particle.position.add(offset);
                
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        Math.random() * 2,
                        (Math.random() - 0.5) * 2
                    ),
                    life: 0.3
                };
                
                scene.add(particle);
                boostParticles.push(particle);
            }
        }
        
        function updateBoostParticles(dt) {
            for (let i = boostParticles.length - 1; i >= 0; i--) {
                const particle = boostParticles[i];
                particle.position.add(particle.userData.velocity.clone().multiplyScalar(dt));
                particle.userData.life -= dt;
                particle.material.opacity = particle.userData.life / 0.3;
                
                if (particle.userData.life <= 0) {
                    scene.remove(particle);
                    boostParticles.splice(i, 1);
                }
            }
        }
        
        function updateBall() {
            if (!ballBody || !ballMesh) return;
            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);
            
            // Damping to prevent infinite rolling
            ballBody.angularVelocity.scale(0.998);
            
            // Check goals
            const ballX = ballBody.position.x;
            const ballZ = ballBody.position.z;
            const ballY = ballBody.position.y;
            
            // Left goal (Blue scores)
            if (ballX < -58 && Math.abs(ballZ) < 10 && ballY < 10) {
                scoreGoal('blue');
            }
            
            // Right goal (Orange scores)
            if (ballX > 58 && Math.abs(ballZ) < 10 && ballY < 10) {
                scoreGoal('orange');
            }
            
            // Reset ball if too far
            if (Math.abs(ballX) > 80 || Math.abs(ballZ) > 60 || ballY < -10) {
                resetBall();
            }
        }
        
        function scoreGoal(team) {
            resetBall();
            
            if (team === 'blue') {
                blueScore++;
                document.getElementById('blueScore').textContent = blueScore;
                showGoalText('BLUE SCORES!');
            } else {
                orangeScore++;
                document.getElementById('orangeScore').textContent = orangeScore;
                showGoalText('ORANGE SCORES!');
            }
            
            // Reset cars
            carBody.position.set(0, 2, 25);
            carBody.velocity.set(0, 0, 0);
            carBody.angularVelocity.set(0, 0, 0);
            carBody.quaternion.set(0, 0, 0, 1);
            
            aiCarBody.position.set(0, 2, -25);
            aiCarBody.velocity.set(0, 0, 0);
            aiCarBody.angularVelocity.set(0, 0, 0);
            aiCarBody.quaternion.set(0, 1, 0, 0);
        }
        
        function resetBall() {
            ballBody.position.set(0, 5, 0);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
        }
        
        function showGoalText(text) {
            const goalText = document.getElementById('goalText');
            goalText.textContent = text;
            goalText.classList.add('show');
            setTimeout(() => {
                goalText.classList.remove('show');
            }, 2000);
        }
        
        function updateCamera() {
            if (!carMesh) return;
            
            // Camera follows car
            const carPos = carMesh.position.clone();
            const carForward = new THREE.Vector3(0, 0, -1);
            carForward.applyQuaternion(carMesh.quaternion);
            
            const targetPos = carPos.clone().sub(carForward.multiplyScalar(12));
            targetPos.y += 8;
            
            camera.position.lerp(targetPos, 0.1);
            camera.lookAt(carPos.clone().add(new THREE.Vector3(0, 2, 0)));
        }
        
        function updateTimer(dt) {
            if (!gameRunning) return;
            
            gameTime -= dt;
            if (gameTime <= 0) {
                gameTime = 0;
                gameRunning = false;
                showGoalText('GAME OVER!');
            }
            
            const minutes = Math.floor(gameTime / 60);
            const seconds = Math.floor(gameTime % 60);
            document.getElementById('timer').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // ============ MAIN LOOP ============
        function animate() {
            requestAnimationFrame(animate);
            
            deltaTime = Math.min(clock.getDelta(), 0.05);
            
            if (gameRunning) {
                // Physics step
                world.step(1/60, deltaTime, 3);
                
                // Update game objects
                updatePlayerCar(deltaTime);
                updateAICar(deltaTime);
                updateBall();
                updateBoostParticles(deltaTime);
                updateCamera();
                updateTimer(deltaTime);
            }
            
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // ============ START GAME ============
        window.startGame = function() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            gameRunning = true;
            
            // Countdown
            let count = 3;
            const countdownEl = document.getElementById('countdown');
            countdownEl.style.display = 'block';
            countdownEl.textContent = count;
            
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else if (count === 0) {
                    countdownEl.textContent = 'GO!';
                } else {
                    countdownEl.style.display = 'none';
                    clearInterval(interval);
                }
            }, 1000);
        };
        
        // Initialize
        init();
        animate();
    </script>
</body>
</html>
